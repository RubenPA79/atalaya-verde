<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Política de privacidad · Atalaya Verde</title>
<link rel="canonical" href="https://atalayaverde.github.io/privacidad.html">
<meta http-equiv="refresh" content="0;url=https://atalayaverde.github.io/privacidad.html">
<style>
  body{font:16px/1.5 system-ui,sans-serif;background:#f6f3ea;color:#1b2420;margin:0;padding:48px 20px;text-align:center}
  a{color:#1d5c3f}
</style>
</head>
<body>
<p>Esta página se ha mudado a <a id="go" href="https://atalayaverde.github.io/privacidad.html">https://atalayaverde.github.io/privacidad.html</a>.</p>
<p>Si no te redirige automáticamente, pulsa el enlace. Se conservan los parámetros de la dirección.</p>
<script>
(function () {
  var NEW = 'https://atalayaverde.github.io';
  var path = location.pathname || '/';
  path = path.replace(/^\/atalaya-verde(?=\/|$)/, '');
  if (!path) path = '/';
  var dest = NEW + path + location.search + location.hash;
  var a = document.getElementById('go');
  if (a) a.href = dest;
  location.replace(dest);
})();
</script>
</body>
</html>
